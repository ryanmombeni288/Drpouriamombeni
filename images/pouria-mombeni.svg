<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1324"/>
      <stop offset="50%" stop-color="#152445"/>
      <stop offset="100%" stop-color="#070c14"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c59b27" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c59b27" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="avatarGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#2d4b8a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b1324" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bg)"/>
  
  <!-- Subtle decorative grid & rings -->
  <circle cx="400" cy="380" r="280" fill="url(#avatarGlow)" />
  <circle cx="400" cy="380" r="230" fill="none" stroke="#c59b27" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="6,6"/>
  <circle cx="400" cy="380" r="190" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Stylized Executive Silhouette -->
  <!-- Suit Shoulders and Body -->
  <path d="M 230 760 C 240 640, 310 590, 400 590 C 490 590, 560 640, 570 760 L 630 1000 L 170 1000 Z" fill="#101b33" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Shirt & Tie Collar -->
  <path d="M 360 590 L 400 680 L 440 590 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M 390 620 L 410 620 L 415 750 L 400 770 L 385 750 Z" fill="#c59b27"/>
  <!-- Suit Lapels -->
  <path d="M 330 600 L 380 720 L 400 800 L 320 860 L 260 760 Z" fill="#152445"/>
  <path d="M 470 600 L 420 720 L 400 800 L 480 860 L 540 760 Z" fill="#152445"/>

  <!-- Neck -->
  <rect x="375" y="490" width="50" height="90" rx="10" fill="#e2e8f0" opacity="0.85"/>

  <!-- Head / Face Silhouette -->
  <ellipse cx="400" cy="390" rx="95" ry="120" fill="#f1f5f9" opacity="0.9"/>
  <!-- Hair line -->
  <path d="M 305 370 C 310 260, 480 250, 495 360 C 495 330, 470 290, 400 290 C 330 290, 310 330, 305 370 Z" fill="#0b1324"/>

  <!-- Clean Border / Professional Frame Overlay -->
  <rect x="24" y="24" width="752" height="952" rx="20" fill="none" stroke="#c59b27" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="36" y="36" width="728" height="928" rx="16" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Badge at bottom -->
  <rect x="180" y="860" width="440" height="64" rx="32" fill="#0b1324" fill-opacity="0.92" stroke="#c59b27" stroke-width="1.5"/>
  <text x="400" y="898" font-family="system-ui, sans-serif" font-size="19" font-weight="600" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    POURIA MOMBENI, Ph.D.
  </text>
  <text x="400" y="945" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">
    پوریا ممبنی | دکتری اقتصاد
  </text>
</svg>
